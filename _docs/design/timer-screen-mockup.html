<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timer screen mockup (#213, Dusk 5 deg warmer), dark tokens</title>
<style>body{margin:0;padding:24px;background:#000;color:#EDECFB;font-family:Inter,system-ui,sans-serif}</style>
</head>
<body>
<!-- Reference for #327. Static, dark-only; the app uses theme tokens instead of these literals. -->
<!-- Timer screen -->
<div style="width: 390px; height: 844px; box-sizing: border-box; border-radius: 28px; overflow: hidden; background: #11112A; border: 1px solid #33336A; display: flex; flex-direction: column; align-items: center; padding: 28px 24px; gap: 20px">
  <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #949AFF">Focus</div>
    <div style="font-size: 13px; color: #ABABD3">Block 2 of 4</div>
  </div>
  <div style="margin-top: 90px; width: 280px; height: 280px; border-radius: 50%; border: 10px solid #1B1B3C; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: inset 0 0 0 2px #33336A">
    <div aria-label="Time" style="font-size: 64px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">18:42</div>
    <div style="font-size: 14px; color: #ABABD3">of 25:00</div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
    <div style="font-size: 13px; padding: 4px 12px; border-radius: 999px; background: #1B1B3C; color: #EDECFB">Work</div>
    <div style="font-size: 16px; color: #EDECFB">Finish chapter 3 notes</div>
  </div>
  <div style="margin-top: auto; align-self: stretch; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px; background: #1B1B3C; border-radius: 14px; padding: 12px 14px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ABABD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"></path><path d="M8 19v2M8 13v2M16 19v2M16 13v2M12 21v2M12 15v2"></path></svg>
      <div style="font-size: 14px; flex: 1">Rain</div>
      <div style="width: 120px; height: 4px; border-radius: 2px; background: #33336A"><div style="width: 70px; height: 4px; border-radius: 2px; background: #949AFF"></div></div>
    </div>
    <div style="display: flex; gap: 12px">
      <button style="flex: 1; min-height: 52px; border: 0; border-radius: 14px; background: #949AFF; color: #0D0D33; font: 700 16px Inter, sans-serif">Pause</button>
      <button style="flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid #33336A; background: transparent; color: #EDECFB; font: 600 16px Inter, sans-serif">Stop</button>
    </div>
  </div>
</div>
</body>
</html>
