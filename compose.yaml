# Local development stack: `make up` (or plain `docker compose up -d --build`) from the repo root.
#
#   app   http://localhost:8000   FastAPI + built frontend (image from ./Dockerfile)
#   db    localhost:5432          Postgres, data in the named volume `db-data`
#   lgtm  http://localhost:3000   Grafana + OTLP ingest (grafana/otel-lgtm)
#
# The app starts once the database is healthy, applies the migrations
# (`alembic upgrade head`, image entrypoint), then serves and sends traces, metrics
# and logs over OTLP to `lgtm`. All ports are published on 127.0.0.1 only.
#
# Values come from `.env` (copy `.env.example`); the defaults below are
# local-only development values, never used on a server.
# Production and dev Compose files live in infra/ (#27).
#
# One stack per checkout (#83): COMPOSE_PROJECT_NAME in .env overrides the project name
# below, and the *_PORT variables move the host ports, so a second git worktree runs its
# own stack beside this one (_docs/process.md, Parallel sessions). `make up` prints the
# project and the URLs in use.

name: focus-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # No `image:` name: Compose tags the build `<project>-app`, so parallel stacks
    # (other worktrees, COMPOSE_PROJECT_NAME) don't overwrite each other's image.
    environment:
      # The app reaches Postgres by service name. Built from the POSTGRES_* values,
      # so the host-side DATABASE_URL in .env (localhost) does not apply here.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-focus}:${POSTGRES_PASSWORD:-focus}@db:5432/${POSTGRES_DB:-focus}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
      # The local stack is plain http, where browsers and curl drop `Secure` cookies,
      # so sign-in needs the flag off here. Local only: the app defaults it on, and the
      # dev and prod Compose files in infra/ leave it on (#27, #28).
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Sign-in lifetime and the sign-in / sign-up rate limits (#8, #77), so editing
      # them in .env takes effect locally. The defaults are the app's own
      # (backend/app/config.py); scripts/tests/test_local_compose.py keeps them in step.
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SIGNIN_MAX_FAILURES: ${SIGNIN_MAX_FAILURES:-5}
      SIGNIN_MAX_FAILURES_PER_CLIENT: ${SIGNIN_MAX_FAILURES_PER_CLIENT:-20}
      SIGNIN_WINDOW_SECONDS: ${SIGNIN_WINDOW_SECONDS:-900}
      SIGNUP_MAX_PER_CLIENT: ${SIGNUP_MAX_PER_CLIENT:-10}
      SIGNUP_WINDOW_SECONDS: ${SIGNUP_WINDOW_SECONDS:-3600}
      # The alert trigger (#33): the share of session saves that fail on purpose, 0 (off)
      # to 100. Read at startup, e.g. `FAULT_SAVE_ERROR_PERCENT=30 docker compose up -d app`.
      FAULT_SAVE_ERROR_PERCENT: ${FAULT_SAVE_ERROR_PERCENT:-0}
      # Run `alembic upgrade head` before the server starts (image entrypoint).
      MIGRATE_ON_START: ${MIGRATE_ON_START:-1}
      # OpenTelemetry: traces, metrics and logs over OTLP/HTTP to the lgtm container.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      lgtm:
        condition: service_started
    healthcheck:
      # GET, not HEAD: the API answers HEAD on /healthz with 405.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focus}
      POSTGRES_DB: ${POSTGRES_DB:-focus}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000" # Grafana UI
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
    volumes:
      # The key-journey dashboard (#32), the same model Grafana Cloud imports for prod
      # and dev, filtered on deployment.environment.name=local. Generated by
      # scripts/grafana_dashboards.py; `make check-stack` runs its queries.
      - ./infra/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/focus.yaml:ro
      - ./infra/grafana/dashboards/key-journey-local.json:/otel-lgtm/focus-dashboards/key-journey-local.json:ro
      # The user-impact alert rules (#33), the same model Grafana Cloud gets for prod and
      # dev. Generated by scripts/grafana_alerts.py; `make check-stack` checks they
      # evaluate and their queries return data.
      - ./infra/grafana/alerts/key-journey-local.json:/otel-lgtm/grafana/conf/provisioning/alerting/focus-alerts.json:ro
    mem_limit: 2g
    restart: unless-stopped

volumes:
  db-data:
