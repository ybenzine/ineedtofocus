# Pre-commit hooks. Install once with `make hooks`; run on everything with
# `uvx pre-commit run --all-files`.
#
# Ruff, ESLint and Prettier run as local hooks through the project's own
# toolchains (uv for backend/, npm for frontend/), so the versions match
# `make lint` and CI exactly. `npm exec --no` never downloads a package: without
# `make install` (which `make hooks` runs first) the hook fails instead of
# fetching an unpinned eslint or prettier.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$|^infra/server/tests/provenance/.*\.json$
      - id: end-of-file-fixer
        # Recorded registry objects, addressed by their sha256 (#177): byte for byte.
        exclude: ^infra/server/tests/provenance/.*\.json$
      - id: check-yaml
        # Compose's `!override` merge tag isn't plain YAML; `make test-prod-stack` loads it.
        exclude: ^infra/tests/compose\.edge\.smoke\.yml$
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$ # JSONC (comments allowed)
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv --directory backend run ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format (backend)
        entry: uv --directory backend run ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend exec --no -- eslint --config frontend/eslint.config.js --fix --max-warnings 0
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend exec --no -- prettier --write --ignore-unknown
        language: system
        files: ^frontend/
        exclude: ^frontend/(package-lock\.json|public/)
