# CI: lint, type-check and every test suite on each pull request and each push to main.
#
# The job names below are the required status checks on `main` (branch protection,
# infra/github/main-branch-protection.json). Renaming a job means updating that file
# and the protection settings in the same PR, or every PR stalls on a missing check.
#
# Each job goes through the same `make` targets as local work (Makefile). Test jobs write
# JUnit XML to reports/ and upload it as a workflow artifact, even when tests fail.
#
# Three more jobs, not required checks:
#   image       (#27) builds the app image, validates the production configs and
#               smoke-tests the production stack (Caddy + prod + dev) on it. Every PR and
#               push. No credentials.
#   publish     (#27) pushes that same image to ghcr.io/ybenzine/ineedtofocus:<commit sha>.
#               Only on push to main, only after all five required jobs and `image` passed
#               on that commit (`needs:`), with GITHUB_TOKEN limited to `packages: write`
#               for this job. PRs (forks included) never push. No tag or release trigger
#               publishes anything. Outputs the pushed digest.
#   deploy-dev  (#28) deploys exactly that digest to focus-dev over SSH, then smoke-tests
#               https://dev.ineedtofoc.us. `needs: publish`, so a red main never reaches
#               dev. Runs in the `dev` environment, whose SSH key the server pins to the
#               forced command /opt/focus/bin/focus-ci dev (infra/server/focus-ci.sh).
#               Skips with a notice while that environment's secrets aren't set.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR (a new push cancels the old run); runs on main are never cancelled.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.4" # same as the Dockerfile
  NODE_VERSION: "24" # same as the Dockerfile
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - name: ruff, ruff format --check, mypy (strict)
        run: make lint-backend
      - name: eslint, prettier --check, tsc (strict)
        run: make lint-frontend
      - name: ruff, ruff format --check, mypy (strict) on scripts/
        run: make lint-scripts
      - name: shellcheck on every tracked shell script
        run: make lint-shell
      - name: actionlint on the workflows
        run: make lint-workflows

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make test-backend-unit JUNIT_DIR=reports
      - name: Summarise the report
        if: ${{ !cancelled() }}
        run: python3 scripts/check_junit.py reports/backend-unit.xml --title "Backend unit tests" --min-tests 1
      - name: Repo script tests (scripts/tests)
        run: make test-scripts JUNIT_DIR=reports
      - name: Summarise the script test report
        if: ${{ !cancelled() }}
        run: python3 scripts/check_junit.py reports/scripts.xml --title "Repo script tests" --min-tests 1
      - name: Server bootstrap (infra/server/bootstrap.sh in an Ubuntu 24.04 container)
        run: make test-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-backend-unit
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine # same as compose.yaml
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway CI container, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # The tests connect as `focus`, a role with CREATEDB but not superuser: each test
      # creates and drops its own focus_test_<random> database (_docs/testing.md).
      DATABASE_URL: postgresql+asyncpg://focus:focus@localhost:5432/focus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the test role (LOGIN CREATEDB, no superuser)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE focus LOGIN PASSWORD 'focus' NOSUPERUSER CREATEDB" \
            -c "CREATE DATABASE focus OWNER focus" \
            -c "GRANT pg_signal_backend TO focus"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make test-backend-integration JUNIT_DIR=reports
      - name: Fail if any integration test skipped (a skip means no database was used)
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/check_junit.py reports/backend-integration.xml
          --title "Backend integration tests" --min-tests 1 --no-skips
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-backend-integration
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make test-frontend JUNIT_DIR=reports
      - name: Summarise the report
        if: ${{ !cancelled() }}
        run: python3 scripts/check_junit.py reports/frontend-unit.xml --title "Frontend unit tests" --min-tests 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-frontend-unit
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: End-to-end (Compose stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Where Playwright (#23) reaches the app started by `make up`.
      PLAYWRIGHT_BASE_URL: http://localhost:8000
      # The suite signs up a fresh user per test (and retries): lift the per-client limit (default 10 an hour).
      SIGNUP_MAX_PER_CLIENT: "1000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack (build the app image, wait until healthy)
        run: make up
      - name: Check health, frontend, sign-up and telemetry (no query strings or cookies leak)
        run: make check-stack
      - name: Look for Playwright suites
        id: suites
        run: |
          if compgen -G 'frontend/playwright.config.*' > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            msg="Playwright did NOT run: there are no suites yet (frontend/playwright.config.* lands with #23). This job only checked the stack with make check-stack."
            echo "::warning title=Playwright not run::$msg"
            printf '### End-to-end\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.suites.outputs.found == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright and its browser
        if: steps.suites.outputs.found == 'true'
        run: |
          make frontend/node_modules
          npm --prefix frontend exec --no -- playwright install --with-deps chromium
      - name: Run Playwright against the stack
        if: steps.suites.outputs.found == 'true'
        run: make test-e2e
      - name: Save the stack's logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          docker compose ps --all > reports/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > reports/compose.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-e2e
          path: |
            reports/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  image:
    name: Image build and production stack smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/ybenzine/ineedtofocus:${{ github.sha }}
      APP_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate production configs (Compose, Caddy, Collector, deploy rules)
        run: make test-infra
      - name: Build the app image (root Dockerfile)
        env:
          REVISION: ${{ github.sha }}
        run: docker build --label "org.opencontainers.image.revision=$REVISION" -t "$IMAGE" .
      - name: Smoke-test the production stack on this image
        run: make test-prod-stack SMOKE_LOG_DIR=reports/prod-stack
      - name: Save the tested image for `publish`
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE" | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: app-image
          path: image.tar.gz
          if-no-files-found: error
          compression-level: 0 # already gzipped
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-prod-stack
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish image to GHCR
    # Never on pull requests: only commits on main that passed every check below.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend-unit, backend-integration, frontend-unit, e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      # sha256:<64 hex>, what deploy-dev deploys and records (a re-push of the tag
      # can't change what this run deploys).
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/ybenzine/ineedtofocus:${{ github.sha }}
    steps:
      # No checkout: this job runs no repository code, it only pushes the tested image.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-image
      - name: Load the image `image` tested
        env:
          REVISION: ${{ github.sha }}
        run: |
          gunzip -c image.tar.gz | docker load
          label=$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [[ $label == "$REVISION" ]] || { echo "::error::image revision $label != $REVISION"; exit 1; }
      - name: Push to GHCR, tagged with the commit SHA
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{ index .RepoDigests 0 }}')
          docker logout ghcr.io
          [[ ${digest#*@} =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $IMAGE: $digest"; exit 1; }
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          {
            echo "### Published image"
            echo ""
            echo "| Tag | Digest |"
            echo "|---|---|"
            echo "| \`$IMAGE\` | \`$digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy to dev
    # Only after publish pushed this commit's image, and publish needs all five required
    # jobs and `image`: a red main never reaches dev (#28).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The dev deploy key and the server's host key are secrets of this environment only
    # (deployment branches: main). The key can only run focus-ci's dev profile.
    environment:
      name: dev
      url: https://dev.ineedtofoc.us
    # One dev deploy at a time; a newer commit's deploy waits, it doesn't cancel this one.
    # Deploys of different environments are serialized on the server by flock on
    # /opt/focus/deploy.lock, not by sharing this group: GitHub cancels a *pending* job
    # when another one joins its group, which would drop a queued prod rollback.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_HOST: 159.223.188.176
      DEV_URL: https://dev.ineedtofoc.us
      TAG: ${{ github.sha }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Check the dev environment is set up
        id: config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # Both secrets: deploy. Neither: not set up yet, skip green with a notice.
        # Only one: a misconfiguration, fail red.
        run: |
          if [[ -n $DEPLOY_SSH_KEY && -n $DEPLOY_KNOWN_HOSTS ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n $DEPLOY_SSH_KEY || -n $DEPLOY_KNOWN_HOSTS ]]; then
            missing=DEPLOY_KNOWN_HOSTS
            [[ -n $DEPLOY_SSH_KEY ]] || missing=DEPLOY_SSH_KEY
            echo "::error title=Dev environment half set up::the dev environment has one of DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS but not $missing. Set both (_docs/deployment.md, Deploy to dev)."
            exit 1
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          msg="Not deployed: the dev environment has neither DEPLOY_SSH_KEY nor DEPLOY_KNOWN_HOSTS yet. The image is published; see _docs/deployment.md (Deploy to dev) for the one-time setup."
          echo "::notice title=Dev deploy skipped::$msg"
          printf '### Deploy to dev: skipped\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.configured == 'true'
        with:
          persist-credentials: false
      - name: Set up the deploy key
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ $TAG =~ ^[0-9a-f]{40}$ && $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] ||
            { echo "::error::bad tag or digest from publish: '$TAG' '$DIGEST'"; exit 1; }
          dir=$RUNNER_TEMP/deploy-ssh
          install -d -m 700 "$dir"
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key")
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          cat > "$dir/config" << EOF
          Host focus-dev
            HostName $DEPLOY_HOST
            User deploy
            IdentityFile $dir/key
            IdentitiesOnly yes
            UserKnownHostsFile $dir/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          echo "SSH_CONFIG=$dir/config" >> "$GITHUB_ENV"
      - name: Deploy over SSH (pull by digest, migrate, start, check, record)
        id: deploy
        if: steps.config.outputs.configured == 'true'
        run: ssh -F "$SSH_CONFIG" focus-dev "deploy $TAG $DIGEST"
      - name: Read the server's release record
        id: record
        if: steps.config.outputs.configured == 'true'
        run: |
          ssh -F "$SSH_CONFIG" focus-dev status > "$RUNNER_TEMP/release"
          cat "$RUNNER_TEMP/release"
          get() { sed -n "s/^$1=//p" "$RUNNER_TEMP/release"; }
          [[ $(get tag) == "$TAG" && $(get digest) == "$DIGEST" ]] ||
            { echo "::error::dev's record doesn't show $TAG $DIGEST"; exit 1; }
          for key in deployed_at infra_revision previous_tag; do
            echo "$key=$(get "$key")" >> "$GITHUB_OUTPUT"
          done
      - name: Smoke-test https://dev.ineedtofoc.us
        id: smoke
        if: steps.config.outputs.configured == 'true'
        run: python3 scripts/smoke_deploy.py "$DEV_URL" --summary "$RUNNER_TEMP/smoke.md"
      - name: Summary
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' }}
        env:
          DEPLOYED_AT: ${{ steps.record.outputs.deployed_at }}
          INFRA_REVISION: ${{ steps.record.outputs.infra_revision }}
          PREVIOUS_TAG: ${{ steps.record.outputs.previous_tag }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "### Deploy to dev: ${DEPLOY_OUTCOME/success/deployed}, smoke tests: ${SMOKE_OUTCOME/success/passed}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | $DEV_URL |"
            echo "| Tag (commit) | \`$TAG\` |"
            echo "| Image | \`ghcr.io/ybenzine/ineedtofocus@$DIGEST\` |"
            echo "| Deployed at (server, UTC) | ${DEPLOYED_AT:-not recorded} |"
            echo "| Previous tag (rollback target) | \`${PREVIOUS_TAG:-none}\` |"
            echo "| Infra revision on the server | \`${INFRA_REVISION:-unknown}\` |"
            echo ""
            cat "$RUNNER_TEMP/smoke.md" 2> /dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"
