# CI: lint, type-check and every test suite on each pull request and each push to main.
#
# The job names below are the required status checks on `main` (branch protection,
# infra/github/main-branch-protection.json). Renaming a job means updating that file
# and the protection settings in the same PR, or every PR stalls on a missing check.
#
# Each job goes through the same `make` targets as local work (Makefile). Test jobs write
# JUnit XML to reports/ and upload it as a workflow artifact, even when tests fail.
#
# Five more jobs, not required checks:
#   image       (#27) builds the app image, validates the production configs and
#               smoke-tests the production stack (Caddy + prod + dev) on it. Every PR and
#               push. No credentials.
#   publish     (#27) pushes that same image to ghcr.io/ybenzine/ineedtofocus:<commit sha>.
#               Only on push to main, only after all five required jobs and `image` passed
#               on that commit (`needs:`), with GITHUB_TOKEN limited to `packages: write`
#               for this job. PRs (forks included) never push. No tag or release trigger
#               publishes anything. Outputs the pushed digest, and attests it (#128): a
#               signed build provenance statement that ci.yml on refs/heads/main built
#               those bytes from this commit. It's the only job with `id-token: write`
#               and `attestations: write`.
#   deploy-dev  (#28) deploys exactly that digest to focus-dev over SSH, then smoke-tests
#               https://dev.ineedtofoc.us. `needs: publish`, so a red main never reaches
#               dev. Verifies the digest's attestation first, as deploy-prod.yml does
#               (#128), and focus-ci on the server again (#177). Runs in the `dev` environment, whose SSH key the server pins to the
#               forced command /opt/focus/bin/focus-ci dev (infra/server/focus-ci.sh).
#               Skips with a notice while that environment's secrets aren't set. If the
#               new release fails its checks after starting, the server starts the
#               previous one again and the job fails (#30). Rolling dev back by hand is
#               .github/workflows/rollback.yml. Deploys only go forward (#257): a commit
#               older than the one dev runs (an ancestor of it) skips green with a notice,
#               so a run whose CI finished late can't put an older commit on dev.
#   dev-deployment  (#257) creates the `dev` GitHub deployment, only after deploy-dev
#               deployed this commit and its smoke tests passed. deploy-dev itself runs
#               with `deployment: false`, so a skipped deploy never shows as a successful
#               one: deploy-prod's plan reads dev's deployments as "what dev ran".
#   dev-catch-up  (#275) warns when main's newest commit's Deploy to dev was cancelled
#               (an older commit's deploy replaced it while it was pending), so dev lags
#               main until someone re-runs that job or merges again. Read-only API calls.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR (a new push cancels the old run); runs on main are never cancelled.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.4" # same as the Dockerfile
  NODE_VERSION: "24" # same as the Dockerfile
  CLAUDE_CODE_VERSION: "2.1.310" # same as oncall.yml (scripts/tests/test_oncall_cli.py)
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - name: ruff, ruff format --check, mypy (strict)
        run: make lint-backend
      - name: eslint, prettier --check, tsc (strict)
        run: make lint-frontend
      - name: ruff, ruff format --check, mypy (strict) on scripts/
        run: make lint-scripts
      - name: shellcheck on every tracked shell script
        run: make lint-shell
      - name: actionlint on the workflows
        run: make lint-workflows

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make test-backend-unit JUNIT_DIR=reports
      - name: Summarise the report
        if: ${{ !cancelled() }}
        run: python3 scripts/check_junit.py reports/backend-unit.xml --title "Backend unit tests" --min-tests 1
      # The on-call sessions' permissions (#232): scripts/tests/test_oncall_cli.py runs the
      # on-call workflow's pinned Claude Code on a fresh checkout against a fake API, so no
      # key and no cost. Required here, so it can't skip.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install Claude Code, the on-call workflow's pinned version
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Repo script tests (scripts/tests)
        env:
          ONCALL_CLI_CHECK: required
        run: make test-scripts JUNIT_DIR=reports
      - name: Summarise the script test report
        if: ${{ !cancelled() }}
        run: python3 scripts/check_junit.py reports/scripts.xml --title "Repo script tests" --min-tests 1
      - name: Server bootstrap (infra/server/bootstrap.sh in an Ubuntu 24.04 container)
        run: make test-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-backend-unit
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine # same as compose.yaml
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway CI container, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # The tests connect as `focus`, a role with CREATEDB but not superuser: each test
      # creates and drops its own focus_test_<random> database (_docs/testing.md).
      DATABASE_URL: postgresql+asyncpg://focus:focus@localhost:5432/focus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the test role (LOGIN CREATEDB, no superuser)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE focus LOGIN PASSWORD 'focus' NOSUPERUSER CREATEDB" \
            -c "CREATE DATABASE focus OWNER focus" \
            -c "GRANT pg_signal_backend TO focus"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make test-backend-integration JUNIT_DIR=reports
      - name: Fail if any integration test skipped (a skip means no database was used)
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/check_junit.py reports/backend-integration.xml
          --title "Backend integration tests" --min-tests 1 --no-skips
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-backend-integration
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make test-frontend JUNIT_DIR=reports
      - name: Summarise the report
        if: ${{ !cancelled() }}
        run: python3 scripts/check_junit.py reports/frontend-unit.xml --title "Frontend unit tests" --min-tests 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-frontend-unit
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: End-to-end (Compose stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Where Playwright (#23) reaches the app started by `make up`.
      PLAYWRIGHT_BASE_URL: http://localhost:8000
      # The suite signs up a fresh user per test (and retries): lift the per-client limit (default 10 an hour).
      SIGNUP_MAX_PER_CLIENT: "1000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack (build the app image, wait until healthy)
        run: make up
      - name: Check health, frontend, sign-up and telemetry (no query strings or cookies leak)
        run: make check-stack
      - name: Look for Playwright suites
        id: suites
        run: |
          if compgen -G 'frontend/playwright.config.*' > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            msg="Playwright did NOT run: there are no suites yet (frontend/playwright.config.* lands with #23). This job only checked the stack with make check-stack."
            echo "::warning title=Playwright not run::$msg"
            printf '### End-to-end\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.suites.outputs.found == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright and its browser
        if: steps.suites.outputs.found == 'true'
        run: |
          make frontend/node_modules
          npm --prefix frontend exec --no -- playwright install --with-deps chromium
      - name: Run Playwright against the stack
        if: steps.suites.outputs.found == 'true'
        run: make test-e2e
      - name: Save the stack's logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          docker compose ps --all > reports/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > reports/compose.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-e2e
          path: |
            reports/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  image:
    name: Image build and production stack smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/ybenzine/ineedtofocus:${{ github.sha }}
      APP_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate production configs (Compose, Caddy, Collector, deploy rules)
        run: make test-infra
      - name: Build the app image (root Dockerfile)
        env:
          REVISION: ${{ github.sha }}
        run: docker build --label "org.opencontainers.image.revision=$REVISION" -t "$IMAGE" .
      - name: Smoke-test the production stack on this image
        run: make test-prod-stack SMOKE_LOG_DIR=reports/prod-stack
      - name: Save the tested image for `publish`
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash # -eo pipefail: a failed `docker save` fails the step, not just gzip's status
        run: docker save "$IMAGE" | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: app-image
          path: image.tar.gz
          if-no-files-found: error
          compression-level: 0 # already gzipped
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-prod-stack
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish image to GHCR
    # Never on pull requests: only commits on main that passed every check below.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, backend-unit, backend-integration, frontend-unit, e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Build provenance (#128): the OIDC token for the Sigstore signing certificate, and
      # storing the attestation. No other job in any workflow gets either.
      id-token: write
      attestations: write
    outputs:
      # sha256:<64 hex>, what deploy-dev deploys and records (a re-push of the tag
      # can't change what this run deploys).
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/ybenzine/ineedtofocus:${{ github.sha }}
    steps:
      # No checkout: this job runs no repository code, it only pushes the tested image.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-image
      - name: Load the image `image` tested
        env:
          REVISION: ${{ github.sha }}
        shell: bash # -eo pipefail, for gunzip | docker load
        run: |
          gunzip -c image.tar.gz | docker load
          label=$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [[ $label == "$REVISION" ]] || { echo "::error::image revision $label != $REVISION"; exit 1; }
      - name: Push to GHCR, tagged with the commit SHA
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        shell: bash # -eo pipefail, for printf | docker login
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{ index .RepoDigests 0 }}')
          [[ ${digest#*@} =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $IMAGE: $digest"; exit 1; }
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          {
            echo "### Published image"
            echo ""
            echo "| Tag | Digest |"
            echo "|---|---|"
            echo "| \`$IMAGE\` | \`$digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Build provenance (#128): a Sigstore-signed SLSA provenance statement for exactly
      # the pushed digest, whose certificate names ci.yml, refs/heads/main and this
      # commit. Stored in GitHub's attestation store and, with push-to-registry (using the
      # login above), next to the image in GHCR. deploy-dev and deploy-prod.yml refuse a
      # digest without it (`gh attestation verify`).
      - name: Attest build provenance for the pushed digest
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ybenzine/ineedtofocus
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # storage records exist for organization-owned repositories only
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy-dev:
    name: Deploy to dev
    # Only after publish pushed this commit's image, and publish needs all five required
    # jobs and `image`: a red main never reaches dev (#28).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The dev deploy key and the server's host key are secrets of this environment only
    # (deployment branches: main). The key can only run focus-ci's dev profile.
    # `deployment: false` (#257): GitHub would mark this job's deployment a success
    # whenever the job is green, a skip included. dev-deployment below creates it, only
    # for a commit this job deployed and smoke-tested.
    environment:
      name: dev
      deployment: false
    # One dev deploy at a time; a newer commit's deploy waits, it doesn't cancel this one.
    # The order check below relies on it: only a job of this group moves dev forward, so
    # what it reads from dev still holds when it deploys. cancel-in-progress wouldn't fix
    # #257: jobs reach the group in the order their CI finishes, not in commit order.
    # Deploys of different environments are serialized on the server by flock on
    # /opt/focus/deploy.lock, not by sharing this group: GitHub cancels a *pending* job
    # when another one joins its group, which would drop a queued prod rollback.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read # gh attestation verify (#128)
    outputs:
      # true only when the order check let this commit through (#257); dev-deployment
      # also needs the job to have passed.
      deployed: ${{ steps.order.outputs.deploy }}
    env:
      DEPLOY_HOST: 159.223.188.176
      DEV_URL: https://dev.ineedtofoc.us
      TAG: ${{ github.sha }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Check the dev environment is set up
        id: config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # Both secrets: deploy. Neither: not set up yet, skip green with a notice.
        # Only one: a misconfiguration, fail red.
        run: |
          if [[ -n $DEPLOY_SSH_KEY && -n $DEPLOY_KNOWN_HOSTS ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n $DEPLOY_SSH_KEY || -n $DEPLOY_KNOWN_HOSTS ]]; then
            missing=DEPLOY_KNOWN_HOSTS
            [[ -n $DEPLOY_SSH_KEY ]] || missing=DEPLOY_SSH_KEY
            echo "::error title=Dev environment half set up::the dev environment has one of DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS but not $missing. Set both (_docs/deployment.md, Deploy to dev)."
            exit 1
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          msg="Not deployed: the dev environment has neither DEPLOY_SSH_KEY nor DEPLOY_KNOWN_HOSTS yet. The image is published; see _docs/deployment.md (Deploy to dev) for the one-time setup."
          echo "::notice title=Dev deploy skipped::$msg"
          printf '### Deploy to dev: skipped\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
      # Before the key is even written: dev's releases.log only records bytes publish
      # attested, so prod's check (deploy-prod.yml, the same script) never meets a digest
      # dev ran without one. An early warning: focus-ci verifies the same on the server,
      # and its check is what binds (#177). Keep the two `run` blocks identical
      # (test_ci_workflow.py).
      - name: Verify the image's build provenance (publish on main, this commit)
        id: provenance
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $TAG =~ ^[0-9a-f]{40}$ && $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] ||
            { echo "::error::bad tag or digest: '$TAG' '$DIGEST'"; exit 1; }
          # Only an attestation of exactly these bytes, from this repository's attestation
          # store, signed by ci.yml (its publish job) on a GitHub-hosted runner, for a push
          # to main, at the commit being deployed. gh prints why it refused.
          if ! built_by=$(gh attestation verify "oci://ghcr.io/ybenzine/ineedtofocus@$DIGEST" \
            --repo ybenzine/ineedtofocus \
            --signer-workflow ybenzine/ineedtofocus/.github/workflows/ci.yml \
            --signer-digest "$TAG" \
            --source-ref refs/heads/main \
            --source-digest "$TAG" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners \
            --format json \
            --jq '.[0].verificationResult.signature.certificate.runInvocationURI'); then
            echo "::error title=Build provenance not verified::ghcr.io/ybenzine/ineedtofocus@$DIGEST has no valid attestation that .github/workflows/ci.yml built it on refs/heads/main from $TAG (gh's reason is above). Nothing was deployed."
            exit 1
          fi
          [[ $built_by =~ ^https://github\.com/ybenzine/ineedtofocus/actions/runs/[0-9]+(/attempts/[0-9]+)?$ ]] || built_by=""
          echo "Verified: ghcr.io/ybenzine/ineedtofocus@$DIGEST was built from $TAG by ${built_by:-a ci.yml run on main}"
          echo "built_by=$built_by" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.configured == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # main's history, for the order check (#257)
      - name: Set up the deploy key
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ $TAG =~ ^[0-9a-f]{40}$ && $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] ||
            { echo "::error::bad tag or digest from publish: '$TAG' '$DIGEST'"; exit 1; }
          dir=$RUNNER_TEMP/deploy-ssh
          install -d -m 700 "$dir"
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key")
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          cat > "$dir/config" << EOF
          Host focus-dev
            HostName $DEPLOY_HOST
            User deploy
            IdentityFile $dir/key
            IdentitiesOnly yes
            UserKnownHostsFile $dir/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          echo "SSH_CONFIG=$dir/config" >> "$GITHUB_ENV"
      # Deploys only go forward (#257). Merges that land close together finish CI in any
      # order, so an older commit's job can reach this group after a newer one deployed.
      # This commit is older when it's an ancestor of the commit dev runs (main is
      # linear): skip green with a notice, and dev keeps the newer one. The same commit
      # (a re-run) or a newer one deploys. Going back is rollback.yml, which has no such
      # check. A revert commit on main is newer, so it deploys.
      - name: Check this commit isn't older than the one dev runs
        id: order
        if: steps.config.outputs.configured == 'true'
        # A failure leaves its reason in `reason` for the Summary (#275).
        run: |
          die() {
            echo "reason=$1: $2" >> "$GITHUB_OUTPUT"
            echo "::error title=$1::$2 Nothing was deployed."
            exit 1
          }
          err=$RUNNER_TEMP/current.err
          if ! ssh -F "$SSH_CONFIG" focus-dev status > "$RUNNER_TEMP/current" 2> "$err"; then
            cat "$err" >&2
            die "Dev's release unknown" "couldn't read dev's release record (ssh status failed)."
          fi
          cat "$err" >&2
          # A first deploy only on focus-ci's exact answer for no record (#275): nothing on
          # stdout and its line on stderr. A record that is empty or has no tag= fails red.
          if [[ ! -s $RUNNER_TEMP/current ]] && grep -Fqx "focus-ci: no release recorded for dev yet" "$err"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(sed -n 's/^tag=//p' "$RUNNER_TEMP/current")
          [[ -n $current ]] ||
            die "Dev's release unknown" "dev's release record has no tag."
          [[ $current =~ ^[0-9a-f]{40}$ ]] ||
            die "Dev's release unknown" "dev's release record has a malformed tag."
          if [[ $current == "$TAG" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$current^{commit}" 2> /dev/null ||
            die "Deploy order unknown" "dev runs $current, which isn't in main's history here, so there's no telling whether $TAG is newer. Roll dev back to a release on main, then re-run this job (_docs/deployment.md, Deploy order)."
          older=0
          git merge-base --is-ancestor "$TAG" "$current" || older=$?
          case $older in
            0)
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              msg="Not deployed: dev runs $current, which is newer (this commit, $TAG, is an ancestor of it). This run's CI finished after that commit's deploy, and a deploy never puts an older commit on dev (#257). To go back on purpose, use the rollback workflow."
              echo "::notice title=Dev deploy skipped::$msg"
              printf '### Deploy to dev: skipped, dev runs a newer commit\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
              ;;
            1) echo "deploy=true" >> "$GITHUB_OUTPUT" ;;
            *) die "Deploy order unknown" "git merge-base --is-ancestor $TAG $current failed (exit $older)." ;;
          esac
      - name: Deploy over SSH (pull by digest, migrate, start, check, record)
        id: deploy
        if: steps.config.outputs.configured == 'true' && steps.order.outputs.deploy == 'true'
        run: ssh -F "$SSH_CONFIG" focus-dev "deploy $TAG $DIGEST"
      - name: Read the server's release record
        id: record
        if: steps.config.outputs.configured == 'true' && steps.order.outputs.deploy == 'true'
        run: |
          ssh -F "$SSH_CONFIG" focus-dev status > "$RUNNER_TEMP/release"
          cat "$RUNNER_TEMP/release"
          get() { sed -n "s/^$1=//p" "$RUNNER_TEMP/release"; }
          [[ $(get tag) == "$TAG" && $(get digest) == "$DIGEST" ]] ||
            { echo "::error::dev's record doesn't show $TAG $DIGEST"; exit 1; }
          for key in deployed_at infra_revision previous_tag; do
            echo "$key=$(get "$key")" >> "$GITHUB_OUTPUT"
          done
      - name: Smoke-test https://dev.ineedtofoc.us
        id: smoke
        if: steps.config.outputs.configured == 'true' && steps.order.outputs.deploy == 'true'
        run: python3 scripts/smoke_deploy.py "$DEV_URL" --summary "$RUNNER_TEMP/smoke.md"
      # Not after a skip for order (that step wrote its own summary); after a failed
      # provenance or order check it still runs and says nothing was deployed.
      - name: Summary
        if: ${{ !cancelled() && steps.config.outputs.configured == 'true' && steps.order.outputs.deploy != 'false' }}
        env:
          DEPLOYED_AT: ${{ steps.record.outputs.deployed_at }}
          INFRA_REVISION: ${{ steps.record.outputs.infra_revision }}
          PREVIOUS_TAG: ${{ steps.record.outputs.previous_tag }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          BUILT_BY: ${{ steps.provenance.outputs.built_by }}
          ORDER_OUTCOME: ${{ steps.order.outcome }}
          ORDER_REASON: ${{ steps.order.outputs.reason }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "### Deploy to dev: ${DEPLOY_OUTCOME/success/deployed}, smoke tests: ${SMOKE_OUTCOME/success/passed}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | $DEV_URL |"
            echo "| Tag (commit) | \`$TAG\` |"
            echo "| Image | \`ghcr.io/ybenzine/ineedtofocus@$DIGEST\` |"
            echo "| Build provenance | ${PROVENANCE_OUTCOME/success/verified}${BUILT_BY:+, built by $BUILT_BY} |"
            echo "| Deployed at (server, UTC) | ${DEPLOYED_AT:-not recorded} |"
            echo "| Previous tag (rollback target) | \`${PREVIOUS_TAG:-none}\` |"
            echo "| Infra revision on the server | \`${INFRA_REVISION:-unknown}\` |"
            echo ""
            if [[ $PROVENANCE_OUTCOME == failure ]]; then
              echo "Not deployed: the image has no valid build provenance attestation from publish on main for this commit (#128). See the verify step's log."
              echo ""
            fi
            if [[ $ORDER_OUTCOME == failure ]]; then
              echo "Not deployed: the order check failed, see its log (#257).${ORDER_REASON:+ $ORDER_REASON}"
              echo ""
            fi
            if [[ $DEPLOY_OUTCOME == failure ]]; then
              echo "The deploy failed and the record is unchanged. If the new release failed its checks after starting, the server started the previous release again (automatic revert, #30): see the deploy step's log."
              echo ""
            fi
            cat "$RUNNER_TEMP/smoke.md" 2> /dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"

  dev-deployment:
    name: Record the dev deployment
    # The `dev` GitHub deployment of this commit (#257), created only once deploy-dev
    # deployed it and passed its smoke tests: never for a skip (not set up, or an older
    # commit than dev runs) or a failure. deploy-prod's plan reads these as what dev ran
    # ("a dev deployment of it succeeded"; dev's release is the newest commit among them
    # since dev's last rollback). No concurrency group: this job can wait for a runner
    # while the next commit deploys, so deployments can be created out of order (#275).
    # The plan orders them by commit, not by creation, so that doesn't matter.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-dev.outputs.deployed == 'true'
    needs: deploy-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: dev
      url: https://dev.ineedtofoc.us
    permissions: {}
    steps:
      # No checkout, no secret: the deployment is what this job is for.
      - name: Record
        env:
          TAG: ${{ github.sha }}
        run: echo "dev runs $TAG, deployed and smoke-tested by Deploy to dev"

  dev-catch-up:
    name: Check dev keeps up with main
    # #275: GitHub keeps one pending job per group, and the one that joins last wins. When
    # an older commit's Deploy to dev replaces a newer one's pending job, the newer run
    # shows as cancelled and dev lags main until the next merge. This job runs in the
    # replacing run (whether it deployed or skipped for order) and flags it: a warning and
    # a summary naming the job to re-run. It doesn't re-run it: that needs
    # `actions: write`, and the re-run would join the deploy-dev group, where it could
    # replace another pending deploy in turn. A re-run of that job deploys its own commit's
    # digest after its own provenance check (it reuses its run's publish output).
    # Only main's newest commit matters: if its deploy is still to come, dev reaches it.
    # Informational: it never fails the run (a failed lookup is a warning).
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-dev.outputs.deployed != '' }}
    needs: deploy-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # main's head and the compare API
      actions: read # main's head's CI run and its Deploy to dev job
    steps:
      # No checkout, no secret: GitHub's API only.
      - name: Flag a newer commit whose Deploy to dev was cancelled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.sha }}
        run: |
          unchecked() {
            echo "::warning title=Dev catch-up not checked::couldn't check whether main's newest commit still deploys to dev ($1). Look at the latest CI run on main."
            exit 0
          }
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha) || unchecked "reading main failed"
          [[ $head =~ ^[0-9a-f]{40}$ ]] || unchecked "main's head isn't a commit sha"
          if [[ $head == "$TAG" ]]; then
            echo "This commit is main's newest: nothing newer to deploy."
            exit 0
          fi
          order=$(gh api "repos/$GH_REPO/compare/$TAG...$head?per_page=1" --jq .status) ||
            unchecked "comparing commits failed"
          if [[ $order != ahead ]]; then
            echo "main's head $head isn't newer than $TAG: nothing to flag."
            exit 0
          fi
          run=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=push&branch=main&per_page=1" --jq '.workflow_runs[0].id // ""') ||
            unchecked "listing CI runs failed"
          if [[ -z $run ]]; then
            echo "main's head $head has no CI run yet: its deploy is still to come."
            exit 0
          fi
          [[ $run =~ ^[0-9]+$ ]] || unchecked "unexpected run id"
          job=$(gh api "repos/$GH_REPO/actions/runs/$run/jobs?filter=latest&per_page=100" --jq '.jobs[] | select(.name == "Deploy to dev") | "\(.id) \(.status) \(.conclusion // "")"') ||
            unchecked "listing the run's jobs failed"
          read -r job_id state conclusion <<< "$job"
          if [[ $state != completed || $conclusion != cancelled ]]; then
            echo "main's head $head: its Deploy to dev is ${state:-not created yet}${conclusion:+ ($conclusion)}, nothing to flag."
            exit 0
          fi
          [[ $job_id =~ ^[0-9]+$ ]] || unchecked "unexpected job id"
          url=$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run/job/$job_id
          msg="main's newest commit, $head, hasn't deployed to dev: its Deploy to dev was cancelled ($url), most likely because an older commit's deploy replaced it while it waited in the deploy-dev group. Dev stays behind main until the next merge. To catch up now, re-run that job (Re-run job on its page, or gh run rerun --job $job_id): it deploys its own commit's image, after its own provenance and order checks."
          echo "::warning title=Dev is behind main::$msg"
          printf '### Dev is behind main\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
