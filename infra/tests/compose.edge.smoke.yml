# Smoke-test override for infra/compose.edge.yml (infra/tests/prod_stack.sh only).
# Caddy runs the real Caddyfile, adapted to JSON, with one change: certificates come
# from Caddy's internal CA instead of Let's Encrypt. Ports go to 127.0.0.1 test ports.
services:
  caddy:
    command: ["caddy", "run", "--config", "/etc/caddy/smoke.json"]
    volumes:
      - ${SMOKE_CADDY_JSON:?}:/etc/caddy/smoke.json:ro
    ports: !override
      - "127.0.0.1:${SMOKE_HTTP_PORT:?}:80"
      - "127.0.0.1:${SMOKE_HTTPS_PORT:?}:443"
