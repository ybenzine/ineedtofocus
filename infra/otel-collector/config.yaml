# OpenTelemetry Collector for one deployed environment (#27): one collector per
# Compose project (focus-prod, focus-dev), so dev's telemetry can't crowd out prod's.
#
# The app sends traces, metrics and logs over OTLP to `otel-collector:4317/4318` on
# its project's network. This file holds receivers, processors and the pipelines; the
# exporters come from a second file chosen in infra/compose.prod.yml:
#
#   export.grafana-cloud.yaml   GRAFANA_CLOUD_OTLP_ENDPOINT is set: forward to Grafana Cloud
#   export.yaml                 it isn't (yet, #32): accept and drop, so the app's
#                               exporters don't error and deploys aren't blocked
#
# The collector merges the two files: maps merge, lists are replaced.
# Privacy: the app's attribute allowlist (_docs/observability.md) runs before export;
# the collector adds only the environment name.

extensions:
  # Liveness on :13133 (the image has no shell, so Compose can't probe it; the
  # production-stack smoke test checks it from the app container).
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Refuse data before the container hits its memory limit (percentages of the
  # cgroup limit, mem_limit in infra/compose.prod.yml).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  # Dev and prod stay apart in Grafana Cloud whatever the app sends.
  resource:
    attributes:
      - key: deployment.environment.name
        value: ${env:FOCUS_ENV}
        action: upsert
  batch: {}

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
