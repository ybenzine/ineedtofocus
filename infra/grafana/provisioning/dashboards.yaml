# Grafana dashboard provider for the local stack (#32): compose.yaml mounts this file
# into grafana/otel-lgtm next to its own providers, and the local key-journey dashboard
# (generated by scripts/grafana_dashboards.py) at the path below. Prod and dev dashboards
# are imported into Grafana Cloud instead (_docs/observability.md, Dashboards).
apiVersion: 1

providers:
  - name: "I Need To Focus"
    type: file
    folder: "I Need To Focus"
    # The JSON in git is the source: UI edits can't be saved over it.
    allowUiUpdates: false
    options:
      path: /otel-lgtm/focus-dashboards
      foldersFromFilesStructure: false
