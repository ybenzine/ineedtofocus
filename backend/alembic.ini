[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# The URL comes from DATABASE_URL (see migrations/env.py), never from this file.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
